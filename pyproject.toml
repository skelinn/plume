[project]
name = "plume"
version = "0.1.0"
description = "Open-source 6-DOF simulator for reusable cargo rockets: powered landing, RL, point-to-point hops and sim-to-real calibration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Plume contributors" }]
keywords = ["rocket", "simulation", "mujoco", "reinforcement-learning", "gymnasium", "guidance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "pillow>=10.0",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
rl = [
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "torch>=2.4",
    "tensorboard>=2.16",
    "nvidia-ml-py>=12.0",
    "psutil>=5.9",
]
viz = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "imageio>=2.34",
    "playwright>=1.45",
]

[project.scripts]
plume = "plume.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plume"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "rl: tests that need the rl extra",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/plume/viz/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
ignore = ["E501", "E741", "RUF001", "RUF002", "RUF003"]  # formatter owns line length
