# Default point-to-point cargo vehicle, loosely modelled on a small reusable
# suborbital cargo rocket: ~250 kg of cargo over ~750 km, landing propulsively
# on unprepared ground. One deep-throttling engine (think a clustered engine that
# lands on its centre chamber), cold-gas RCS, four legs.
name: cargo_hopper
description: 8.3 t single-stage reusable cargo hopper, 250 kg payload, ~750 km range.
geometry:
  length: 13.5
  diameter: 1.4
  nose_length: 2.0
legs:
  count: 4
  span: 2.8
  height: 1.3
  attach_z: 2.4
  footpad_radius: 0.25
  max_touchdown_speed: 5.0
mass:
  dry: 1200.0             # structure, engine, legs, avionics
  dry_cg_z: 3.8
  dry_inertia: null
cargo:
  mass: 250.0
  cg_z: 10.6              # cargo bay below the nose
  max_mass: 450.0
tanks:
  - name: lox
    capacity: 4750.0
    z_bottom: 1.5
    z_top: 6.6
    radius: 0.66
  - name: fuel
    capacity: 2050.0
    z_bottom: 6.8
    z_top: 9.6
    radius: 0.66
engine:
  type: liquid
  thrust_vac: 190000.0    # N (liftoff T/W ~2.1)
  isp_vac: 318.0
  isp_sl: 288.0
  throttle_min: 0.08      # deep throttling lets the near-empty vehicle hover
  throttle_max: 1.0
  throttle_tau: 0.15
  max_ignitions: 4        # ascent, entry burn, landing burn (+1 spare)
  gimbal_max_deg: 7.0
  gimbal_rate_deg_s: 20.0
  gimbal_tau: 0.05
  gimbal_z: 0.7
  nozzle_radius: 0.45
rcs:
  enabled: true
  thrust: 700.0
  isp: 72.0
  propellant: 70.0
  z: 12.0
  pods: 4
aero:
  enabled: true
  stations: 12
