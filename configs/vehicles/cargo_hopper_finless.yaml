# The cargo hopper without grid fins -- used to show what the fins buy.
name: cargo_hopper_finless
description: 'The cargo hopper without grid fins (for comparison): RCS only for attitude
  in the atmosphere.'
geometry:
  length: 13.5
  diameter: 1.4
  nose_length: 2.0
legs:
  count: 4
  span: 2.8
  height: 1.3
  attach_z: 2.4
